version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: pip
    directory: /companion/source/app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      companion-python:
        patterns:
          - '*'

  - package-ecosystem: pip
    directory: /companion/source/installer/windows
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      windows-runtime-python:
        patterns:
          - '*'
