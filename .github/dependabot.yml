version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: pip
    directory: /companion/source/app
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      companion-runtime:
        patterns:
          - '*'
