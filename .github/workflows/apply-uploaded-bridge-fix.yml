name: Apply uploaded Bridge fix to main

on:
  push:
    branches:
      - agent/sync-uploaded-fixed-addon
    paths:
      - '.github/workflows/apply-uploaded-bridge-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified Transport patch
        shell: bash
        env:
          EXPECTED_MAIN: fea9f18ffb1bac3db158b522828dd8c7f9fe6532
          EXPECTED_BLOB: 4b03052ac9107dc8a0af75a070924ffa760ff28a
        run: |
          set -euo pipefail
          git fetch origin main
          actual="$(git rev-parse origin/main)"
          test "$actual" = "$EXPECTED_MAIN"
          cp .sync-upload/apply_transport_patch.py /tmp/apply_transport_patch.py
          git checkout -B main origin/main
          python3 /tmp/apply_transport_patch.py
          test "$(git hash-object addon/KeystoneLensBridge/Core/Transport.lua)" = "$EXPECTED_BLOB"
          git add addon/KeystoneLensBridge/Core/Transport.lua
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync uploaded fixed add-on"
          git push origin HEAD:main
