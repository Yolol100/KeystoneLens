name: Apply season transition self-audit round four

on:
  push:
    branches:
      - agent/season-transition-self-audit-work-20260819
    paths:
      - 'scripts/fix-season-transition-self-audit-round4.py'
      - '.github/workflows/apply-season-transition-self-audit-round4.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/season-transition-self-audit-work-20260819
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.15'

      - name: Apply guarded long-running refresh fix
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fix-season-transition-self-audit-round4.py
          git diff --check
          python -m py_compile companion/source/app/keystonelens_companion/*.py companion/source/app/tests/test_season_transition.py

      - name: Commit corrected source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add companion/source/app/keystonelens_companion/engine.py companion/source/app/keystonelens_companion/__main__.py companion/source/app/tests/test_season_transition.py
          git commit -m 'Refresh season context in long-running sessions'
          git push origin "HEAD:${GITHUB_REF_NAME}"
