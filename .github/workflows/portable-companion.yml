name: Portable KeystoneLens Companion

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/portable-companion.yml'
      - 'companion/source/app/**'
      - 'companion/source/portable/**'
      - 'companion/source/runtime/**'
      - 'companion/source/docs/THIRD-PARTY-NOTICES.md'
      - 'companion/source/scripts/make_deterministic_zip.py'
      - 'companion/source/VERSION'
  pull_request:
    paths:
      - '.github/workflows/portable-companion.yml'
      - 'companion/source/app/**'
      - 'companion/source/portable/**'
      - 'companion/source/runtime/**'
      - 'companion/source/docs/THIRD-PARTY-NOTICES.md'
      - 'companion/source/scripts/make_deterministic_zip.py'
      - 'companion/source/VERSION'

permissions:
  contents: read

concurrency:
  group: keystonelens-portable-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable-build:
    name: portable-build-${{ matrix.round }}
    strategy:
      fail-fast: false
      matrix:
        round: [a, b]
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build independently on clean Windows runner
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'portable-out'
          ./companion/source/portable/build-portable.ps1 -OutputDir $out
          $version = (Get-Content -LiteralPath companion/source/VERSION -Raw).Trim()
          $name = "KeystoneLens-Portable-$version-Windows-x64.zip"
          $zip = Join-Path $out $name
          if (-not (Test-Path -LiteralPath $zip)) { throw 'Portable ZIP was not produced.' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          Write-Host "Independent portable build ${{ matrix.round }} SHA-256: $hash"
          "PORTABLE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload independent build round
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keystonelens-portable-round-${{ matrix.round }}-${{ github.sha }}
          path: ${{ env.PORTABLE_ZIP }}
          if-no-files-found: error
          retention-days: 1

  portable-verify:
    needs: portable-build
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download independent build A
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: keystonelens-portable-round-a-${{ github.sha }}
          path: round-a

      - name: Download independent build B
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: keystonelens-portable-round-b-${{ github.sha }}
          path: round-b

      - name: Compare independent portable builds
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath companion/source/VERSION -Raw).Trim()
          $name = "KeystoneLens-Portable-$version-Windows-x64.zip"
          $zipA = Join-Path 'round-a' $name
          $zipB = Join-Path 'round-b' $name
          if (-not (Test-Path -LiteralPath $zipA) -or -not (Test-Path -LiteralPath $zipB)) {
            throw 'Both independent portable build artifacts are required.'
          }
          $hashA = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipA).Hash.ToLowerInvariant()
          $hashB = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipB).Hash.ToLowerInvariant()
          if ($hashA -ne $hashB) { throw "Portable builds are not byte-identical: $hashA != $hashB" }
          "PORTABLE_ZIP=$zipA" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PORTABLE_SHA256=$hashA" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify portable archive contract
        shell: pwsh
        run: |
          $verify = Join-Path $env:RUNNER_TEMP 'portable-contract'
          Expand-Archive -LiteralPath $env:PORTABLE_ZIP -DestinationPath $verify -Force
          foreach ($required in @('START-COMPANION.cmd','portable_launcher.py','VERSION','RUNTIME.json','THIRD-PARTY-NOTICES.md','runtime\python.exe','runtime\pythonw.exe','app\keystonelens_companion\__main__.py')) {
            if (-not (Test-Path -LiteralPath (Join-Path $verify $required))) { throw "Portable package missing: $required" }
          }
          foreach ($forbidden in @('KeystoneLens-Setup.exe','KeystoneLens.exe','KeystoneLens-Uninstall.exe','KeystoneLens-WoW-Watcher.exe')) {
            $hit = Get-ChildItem -LiteralPath $verify -File -Recurse | Where-Object Name -eq $forbidden | Select-Object -First 1
            if ($hit) { throw "Portable package unexpectedly contains: $forbidden" }
          }
          if (Test-Path -LiteralPath (Join-Path $verify 'runtime\Scripts\pip.exe')) { throw 'Portable runtime must not retain pip.exe.' }
          if (Test-Path -LiteralPath (Join-Path $verify 'packages\bin')) { throw 'Portable runtime must not retain pip-generated console scripts.' }
          if (Get-ChildItem -LiteralPath $verify -Directory -Recurse -Filter '__pycache__' -ErrorAction SilentlyContinue | Select-Object -First 1) { throw 'Portable runtime must not contain __pycache__.' }
          if (Get-ChildItem -LiteralPath $verify -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in @('.pyc','.pyo') } | Select-Object -First 1) { throw 'Portable runtime must not contain generated bytecode.' }
          if (Get-ChildItem -LiteralPath (Join-Path $verify 'packages') -File -Recurse -Filter 'RECORD' -ErrorAction SilentlyContinue | Select-Object -First 1) { throw 'Portable packages must not contain pip-generated RECORD metadata.' }
          & (Join-Path $verify 'runtime\python.exe') -B -I (Join-Path $verify 'portable_launcher.py') --verify
          if ($LASTEXITCODE -ne 0) { throw 'Portable archive runtime contract failed.' }
          New-Item -ItemType Directory -Path canonical -Force | Out-Null
          Copy-Item -LiteralPath $env:PORTABLE_ZIP -Destination canonical
          Write-Host "Portable SHA-256: $env:PORTABLE_SHA256"

      - name: Upload canonical portable Companion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keystonelens-portable-${{ github.sha }}
          path: canonical/KeystoneLens-Portable-*-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
