name: Validate and commit KeystoneLens polish

on:
  push:
    branches: [agent/frontend-backend-polish]
    paths: ['.github/workflows/agent-polish-validated.yml']

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontend-backend-polish
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply verified transform
        shell: bash
        run: |
          awk '/^[[:space:]]*python - <<'\''PY'\''/{capture=1; next} capture && /^[[:space:]]*PY[[:space:]]*$/{exit} capture{sub(/^[[:space:]]{10}/, ""); print}' .github/workflows/agent-polish-final.yml > /tmp/apply_polish.py
          python /tmp/apply_polish.py
      - name: Mirror addon for repository tests
        shell: bash
        run: |
          rm -rf companion/source/addon
          mkdir -p companion/source/addon
          cp -a addon/KeystoneLensBridge companion/source/addon/KeystoneLensBridge
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==9.0.2' -r companion/source/app/requirements.txt
      - name: Validate
        working-directory: companion/source
        run: |
          python -m pytest -q
          python -m compileall -q app/keystonelens_companion
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add companion/source/app/keystonelens_companion/ui.py companion/source/app/keystonelens_companion/engine.py companion/source/app/keystonelens_companion/rio.py
          git diff --cached --check
          git commit -m 'Polish existing frontend and backend behavior'
          git push origin HEAD:agent/frontend-backend-polish
