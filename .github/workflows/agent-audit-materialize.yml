name: Finalize KeystoneLens WCL audit fixes

on:
  push:
    branches:
      - agent/audit-fixes-20260816
    paths:
      - '.github/workflows/agent-audit-materialize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/audit-fixes-20260816
          fetch-depth: 0
      - name: Finish WCL timing and copy cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches for {old!r}, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              'companion/source/app/keystonelens_companion/wcl.py',
              'time.time() >= self._blocked_until',
              'time.monotonic() >= self._blocked_until',
          )
          replace_exact(
              'companion/source/app/keystonelens_companion/wcl.py',
              '"antwoord incompleet"',
              '"incomplete response"',
          )

          test = Path('companion/source/app/tests/test_wcl_cache_locking.py')
          text = test.read_text(encoding='utf-8')
          anchor = '    assert "time.time() < self._blocked_until" not in text\n'
          if text.count(anchor) != 1:
              raise SystemExit('test_wcl_cache_locking.py: timing assertion anchor missing')
          replacement = (
              anchor
              + '    assert "time.time() >= self._blocked_until" not in text\n'
              + '    assert "time.time() > self._blocked_until" not in text\n'
              + '    assert "time.time() <= self._blocked_until" not in text\n'
          )
          test.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit final WCL fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Webactueel Audit Fixer'
          git config user.email 'actions@users.noreply.github.com'
          git add companion/source/app/keystonelens_companion/wcl.py companion/source/app/tests/test_wcl_cache_locking.py
          git diff --cached --check
          git commit -m 'Finish WCL timing and copy audit fixes'
          git push origin HEAD:agent/audit-fixes-20260816
