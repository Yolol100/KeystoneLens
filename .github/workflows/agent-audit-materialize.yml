name: Update KeystoneLens architecture contracts

on:
  push:
    branches:
      - agent/audit-fixes-20260816
    paths:
      - '.github/workflows/agent-audit-materialize.yml'

permissions:
  contents: write

jobs:
  update-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/audit-fixes-20260816
          fetch-depth: 0
      - name: Update architecture contract tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'companion/source/app/tests/test_qr_backend.py',
              '''        r"Core\\CapturePolicy.lua",\n        r"Core\\ScreenshotController.lua",''',
              '''        r"Core\\CapturePolicy.lua",\n        r"Core\\TransportState.lua",\n        r"Core\\ScreenshotController.lua",''',
          )

          replace_once(
              'companion/source/app/tests/test_release_contract.py',
              '''def test_bridge_listing_generation_survives_reload_in_saved_variables():\n    transport = (ROOT / "addon/KeystoneLensBridge/Core/Transport.lua").read_text(encoding="utf-8")\n    assert "listingGeneration = 0," in transport\n    assert "KeystoneLensBridgeDB.listingGeneration" in transport''',
              '''def test_bridge_listing_generation_survives_reload_in_saved_variables():\n    state = (ROOT / "addon/KeystoneLensBridge/Core/TransportState.lua").read_text(encoding="utf-8")\n    transport = (ROOT / "addon/KeystoneLensBridge/Core/Transport.lua").read_text(encoding="utf-8")\n    assert "listingGeneration = 0," in state\n    assert "KeystoneLensBridgeDB.listingGeneration" in transport''',
          )
          PY
          git diff --check
      - name: Commit updated contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Webactueel Audit Fixer'
          git config user.email 'actions@users.noreply.github.com'
          git add companion/source/app/tests/test_qr_backend.py companion/source/app/tests/test_release_contract.py
          git diff --cached --check
          git commit -m 'Update transport architecture regression contracts'
          git push origin HEAD:agent/audit-fixes-20260816
