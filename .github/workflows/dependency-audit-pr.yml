name: PR dependency audit

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/dependency-audit-pr.yml'
      - 'companion/source/app/requirements.txt'
      - 'companion/source/runtime/requirements-runtime.txt'
      - 'companion/source/runtime/requirements-runtime.lock'

permissions:
  contents: read

jobs:
  python-dependencies:
    name: PR dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'

      - name: Install pinned audit tool
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pip-audit==2.10.1'

      - name: Audit Companion requirements
        shell: bash
        run: |
          set -euo pipefail
          pip-audit --strict --progress-spinner off -r companion/source/app/requirements.txt

      - name: Audit exact portable runtime package set
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('companion/source/runtime/requirements-runtime.lock')
          output = Path('/tmp/keystonelens-runtime-audit.txt')
          packages = []
          for raw in source.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#') or line.startswith('--hash='):
                  continue
              if line.endswith('\\'):
                  line = line[:-1].rstrip()
              if line and not line.startswith('--hash='):
                  packages.append(line)
          output.write_text('\n'.join(packages) + '\n', encoding='utf-8')
          PY
          pip-audit --strict --progress-spinner off -r /tmp/keystonelens-runtime-audit.txt
