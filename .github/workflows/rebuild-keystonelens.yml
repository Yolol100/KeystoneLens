name: Rebuild KeystoneLens release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rebuild-keystonelens.yml'
      - 'addon/KeystoneLensBridge/**'
      - 'companion/source/**'
      - 'executable/README.md'
  pull_request:
    paths:
      - '.github/workflows/rebuild-keystonelens.yml'
      - 'addon/KeystoneLensBridge/**'
      - 'companion/source/**'
      - 'executable/README.md'

permissions:
  contents: read

concurrency:
  group: keystonelens-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Verify canonical release identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < companion/source/VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fx "__version__ = \"$VERSION\"" companion/source/app/keystonelens_companion/__init__.py
          grep -Fx "## Version: $VERSION" addon/KeystoneLensBridge/KeystoneLensBridge.toc
          test -f "companion/source/docs/RELEASE-NOTES-${VERSION}.md"
          test -f "companion/source/docs/AUDIT-REPORT-${VERSION}.md"

      - name: Compile WoW addon Lua sources
        shell: bash
        run: |
          set -euo pipefail
          find addon/KeystoneLensBridge companion/source/data-addon/KeystoneLensCompanionData \
            -type f -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            LUA_FILE="$file" lua5.1 -e 'local f,e=loadfile(os.getenv("LUA_FILE")); assert(f,e)'
          done

      - name: Verify installer checksum documentation
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'SHA256SUMS.txt' executable/README.md
          if grep -Eq '(^|[^0-9a-fA-F])[0-9a-fA-F]{64}([^0-9a-fA-F]|$)' executable/README.md; then
            echo 'Installer README contains a second hard-coded SHA-256; use SHA256SUMS.txt as the single source of truth.' >&2
            exit 1
          fi

      - name: Verify QR reliability baseline and sync addon source
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'three-physical-pixels-per-module reliability baseline' addon/KeystoneLensBridge/Core/Transport.lua
          if grep -Fq 'one-physical-pixel-per-module' addon/KeystoneLensBridge/Core/Transport.lua; then
            echo 'Stale one-pixel QR documentation returned.' >&2
            exit 1
          fi
          grep -F 'local QR_MODULE_PX = 3' addon/KeystoneLensBridge/Core/Transport.lua
          if grep -Fq 'local QR_MODULE_PX = 1' addon/KeystoneLensBridge/Core/Transport.lua; then
            echo 'QR module size regressed to the fragile one-pixel baseline.' >&2
            exit 1
          fi
          rm -rf companion/source/addon
          mkdir -p companion/source/addon
          cp -a addon/KeystoneLensBridge companion/source/addon/KeystoneLensBridge

      - name: Install runtime-parity test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('companion/source/installer/windows/requirements-runtime.lock')
          output = Path('/tmp/keystonelens-runtime-test.txt')
          packages = []
          for raw in source.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#') or line.startswith('--hash='):
                  continue
              if line.endswith('\\'):
                  line = line[:-1].rstrip()
              if line and not line.startswith('--hash='):
                  packages.append(line)
          output.write_text('\n'.join(packages) + '\n', encoding='utf-8')
          print(output.read_text(encoding='utf-8'), end='')
          PY
          python -m pip install --disable-pip-version-check 'pytest==9.0.2' -r /tmp/keystonelens-runtime-test.txt

      - name: Run regression suite
        shell: bash
        run: |
          set -euo pipefail
          cd companion/source
          python -m pytest -q
          python -m compileall -q app/keystonelens_companion
          grep -F 'local QR_MODULE_PX = 3' addon/KeystoneLensBridge/Core/Transport.lua

      - name: Build release twice and prove determinism
        shell: bash
        run: |
          set -euo pipefail
          cd companion/source
          bash scripts/BUILD-RELEASE.sh
          find release -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/keystonelens-release-round1.sha256
          bash scripts/BUILD-RELEASE.sh
          find release -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/keystonelens-release-round2.sha256
          diff -u /tmp/keystonelens-release-round1.sha256 /tmp/keystonelens-release-round2.sha256

      - name: Stage verified publish payload
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < companion/source/VERSION)"
          mkdir -p /tmp/keystonelens-publish
          cp "companion/source/release/KeystoneLens-Setup-${VERSION}.exe" "/tmp/keystonelens-publish/KeystoneLens-Setup-v${VERSION}-Windows-x64.exe"
          cp "companion/source/release/KeystoneLens-Source-${VERSION}.zip" "/tmp/keystonelens-publish/KeystoneLens-Source-${VERSION}.zip"
          cp "companion/source/release/KeystoneLensBridge-${VERSION}-CurseForge.zip" "/tmp/keystonelens-publish/KeystoneLensBridge-${VERSION}-CurseForge.zip"
          cp "companion/source/docs/AUDIT-REPORT-${VERSION}.md" "/tmp/keystonelens-publish/KeystoneLens-Audit-${VERSION}.md"

      - name: Attest verified publish payload
        if: github.ref == 'refs/heads/main'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: /tmp/keystonelens-publish/*

      - name: Upload verified publish payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keystonelens-verified-publish-${{ github.sha }}
          path: /tmp/keystonelens-publish
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download verified publish payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: keystonelens-verified-publish-${{ github.sha }}
          path: /tmp/keystonelens-publish

      - name: Publish verified repository artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < companion/source/VERSION)"
          cp "/tmp/keystonelens-publish/KeystoneLens-Setup-v${VERSION}-Windows-x64.exe" "executable/KeystoneLens-Setup-v${VERSION}-Windows-x64.exe"
          cp "/tmp/keystonelens-publish/KeystoneLens-Source-${VERSION}.zip" "companion/KeystoneLens-Source-${VERSION}.zip"
          cp "/tmp/keystonelens-publish/KeystoneLensBridge-${VERSION}-CurseForge.zip" "addon/KeystoneLensBridge-${VERSION}-CurseForge.zip"
          cp "/tmp/keystonelens-publish/KeystoneLens-Audit-${VERSION}.md" "companion/KeystoneLens-Audit-${VERSION}.md"
          find README.md SECURITY.md .github/CODEOWNERS addon companion executable -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          if grep -Eq '__pycache__|\.pytest_cache|\.keystonelens-publish|\.release-update|companion/source/release' SHA256SUMS.txt; then
            echo 'Unexpected temporary path in checksum manifest.' >&2
            exit 1
          fi
          sha256sum -c SHA256SUMS.txt

      - name: Commit verified rebuilt artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < companion/source/VERSION)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m "Rebuild verified KeystoneLens ${VERSION} artifacts"
          git push origin "HEAD:refs/heads/main"
