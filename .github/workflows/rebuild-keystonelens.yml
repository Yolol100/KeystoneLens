name: Build and stage KeystoneLens release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/rebuild-keystonelens.yml'
      - '.github/dependabot.yml'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - 'LICENSE-SCOPE.md'
      - 'README.md'
      - 'addon/KeystoneLensBridge/**'
      - 'companion/source/**'
      - 'companion/README.md'
  pull_request:
    paths:
      - '.github/workflows/rebuild-keystonelens.yml'
      - '.github/dependabot.yml'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - 'LICENSE-SCOPE.md'
      - 'README.md'
      - 'addon/KeystoneLensBridge/**'
      - 'companion/source/**'
      - 'companion/README.md'

permissions:
  contents: read

concurrency:
  group: keystonelens-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Audit repository hygiene and supply-chain policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile companion/source/scripts/audit_repository.py companion/source/scripts/audit_external_security.py
          python3 companion/source/scripts/audit_repository.py
          python3 companion/source/scripts/audit_external_security.py
          git diff --check

      - name: Verify canonical release identity and tag parity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < companion/source/VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fx "__version__ = \"$VERSION\"" companion/source/app/keystonelens_companion/__init__.py
          grep -Fx "## Version: $VERSION" addon/KeystoneLensBridge/KeystoneLensBridge.toc
          grep -Fx "## Version: $VERSION" companion/source/data-addon/KeystoneLensCompanionData/KeystoneLensCompanionData.toc
          test -f "companion/source/docs/RELEASE-NOTES-${VERSION}.md"
          test -f "companion/source/docs/AUDIT-REPORT-${VERSION}.md"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi

      - name: Compile WoW addon Lua sources
        shell: bash
        run: |
          set -euo pipefail
          find addon/KeystoneLensBridge companion/source/data-addon/KeystoneLensCompanionData -type f -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            LUA_FILE="$file" lua5.1 -e 'local f,e=loadfile(os.getenv("LUA_FILE")); assert(f,e)'
          done

      - name: Sync canonical Bridge test source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf companion/source/addon
          mkdir -p companion/source/addon
          cp -a addon/KeystoneLensBridge companion/source/addon/KeystoneLensBridge

      - name: Install runtime-parity test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('companion/source/runtime/requirements-runtime.lock')
          output = Path('/tmp/keystonelens-runtime-test.txt')
          packages = []
          for raw in source.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#') or line.startswith('--hash='):
                  continue
              if line.endswith('\\'):
                  line = line[:-1].rstrip()
              if line and not line.startswith('--hash='):
                  packages.append(line)
          output.write_text('\n'.join(packages) + '\n', encoding='utf-8')
          PY
          python -m pip install --disable-pip-version-check 'pytest==9.0.2' -r /tmp/keystonelens-runtime-test.txt

      - name: Run full regression suite
        shell: bash
        run: |
          set -euo pipefail
          cd companion/source
          python -m pytest -q
          python -m compileall -q app/keystonelens_companion

      - name: Build release twice and prove determinism
        shell: bash
        run: |
          set -euo pipefail
          cd companion/source
          bash scripts/BUILD-RELEASE.sh
          find release -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/keystonelens-release-round1.sha256
          bash scripts/BUILD-RELEASE.sh
          find release -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/keystonelens-release-round2.sha256
          diff -u /tmp/keystonelens-release-round1.sha256 /tmp/keystonelens-release-round2.sha256

      - name: Stage verified core release payload
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < companion/source/VERSION)"
          OUT=/tmp/keystonelens-release-core
          mkdir -p "$OUT"
          cp "companion/source/release/KeystoneLens-Source-${VERSION}.zip" "$OUT/KeystoneLens-Source-${VERSION}.zip"
          cp "companion/source/release/KeystoneLensBridge-${VERSION}-CurseForge.zip" "$OUT/KeystoneLensBridge-${VERSION}-CurseForge.zip"
          cp "companion/source/docs/AUDIT-REPORT-${VERSION}.md" "$OUT/KeystoneLens-Audit-${VERSION}.md"
          cp "companion/source/docs/RELEASE-NOTES-${VERSION}.md" "$OUT/RELEASE-NOTES-${VERSION}.md"
          cp companion/source/docs/SBOM.cdx.json "$OUT/SBOM.cdx.json"

      - name: Upload verified core payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keystonelens-release-core-${{ github.sha }}
          path: /tmp/keystonelens-release-core
          if-no-files-found: error
          retention-days: 14

  portable-build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    name: portable-build-${{ matrix.round }}
    strategy:
      fail-fast: false
      matrix:
        round: [a, b]
    runs-on: windows-2025
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Build tagged portable package independently
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'portable-out'
          ./companion/source/portable/build-portable.ps1 -OutputDir $out
          $version = (Get-Content -LiteralPath companion/source/VERSION -Raw).Trim()
          $name = "KeystoneLens-Portable-$version-Windows-x64.zip"
          $zip = Join-Path $out $name
          if (-not (Test-Path -LiteralPath $zip)) { throw 'Tagged portable ZIP was not produced.' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          Write-Host "Tagged independent portable build ${{ matrix.round }} SHA-256: $hash"
          "PORTABLE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload tagged independent build round
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keystonelens-tag-portable-round-${{ matrix.round }}-${{ github.sha }}
          path: ${{ env.PORTABLE_ZIP }}
          if-no-files-found: error
          retention-days: 1

  portable-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: portable-build
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download tagged build A
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: keystonelens-tag-portable-round-a-${{ github.sha }}
          path: round-a

      - name: Download tagged build B
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: keystonelens-tag-portable-round-b-${{ github.sha }}
          path: round-b

      - name: Compare independent tagged portable builds
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath companion/source/VERSION -Raw).Trim()
          $name = "KeystoneLens-Portable-$version-Windows-x64.zip"
          $zipA = Join-Path 'round-a' $name
          $zipB = Join-Path 'round-b' $name
          $hashA = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipA).Hash.ToLowerInvariant()
          $hashB = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipB).Hash.ToLowerInvariant()
          if ($hashA -ne $hashB) { throw "Tagged portable builds are not byte-identical: $hashA != $hashB" }
          $verify = Join-Path $env:RUNNER_TEMP 'portable-verify'
          Expand-Archive -LiteralPath $zipA -DestinationPath $verify -Force
          & (Join-Path $verify 'runtime\python.exe') -I (Join-Path $verify 'portable_launcher.py') --verify
          if ($LASTEXITCODE -ne 0) { throw 'Tagged portable archive verification failed.' }
          foreach ($forbidden in @('KeystoneLens-Setup.exe','KeystoneLens.exe','KeystoneLens-Uninstall.exe','KeystoneLens-WoW-Watcher.exe')) {
            if (Get-ChildItem -LiteralPath $verify -File -Recurse | Where-Object Name -eq $forbidden | Select-Object -First 1) { throw "Obsolete executable in portable ZIP: $forbidden" }
          }
          if (Test-Path -LiteralPath (Join-Path $verify 'runtime\Scripts\pip.exe')) { throw 'Tagged portable runtime must not retain pip.exe.' }
          New-Item -ItemType Directory -Path portable-release -Force | Out-Null
          Copy-Item -LiteralPath $zipA -Destination (Join-Path portable-release $name)
          Write-Host "Tagged portable SHA-256: $hashA"

      - name: Upload portable Windows release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keystonelens-portable-${{ github.sha }}
          path: portable-release
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate
      - portable-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download verified core payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: keystonelens-release-core-${{ github.sha }}
          path: dist

      - name: Download verified portable Windows payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: keystonelens-portable-${{ github.sha }}
          path: dist

      - name: Verify final release payload and checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < companion/source/VERSION)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test -f "dist/KeystoneLensBridge-${VERSION}-CurseForge.zip"
          test -f "dist/KeystoneLens-Source-${VERSION}.zip"
          test -f "dist/KeystoneLens-Portable-${VERSION}-Windows-x64.zip"
          test -f "dist/KeystoneLens-Audit-${VERSION}.md"
          test -f "dist/RELEASE-NOTES-${VERSION}.md"
          test -f dist/SBOM.cdx.json
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd dist && sha256sum -c SHA256SUMS.txt)
          unzip -t "dist/KeystoneLensBridge-${VERSION}-CurseForge.zip" >/dev/null
          unzip -t "dist/KeystoneLens-Source-${VERSION}.zip" >/dev/null
          unzip -t "dist/KeystoneLens-Portable-${VERSION}-Windows-x64.zip" >/dev/null
          python3 - "dist/KeystoneLens-Portable-${VERSION}-Windows-x64.zip" <<'PY'
          import sys, zipfile
          forbidden = {'KeystoneLens-Setup.exe','KeystoneLens.exe','KeystoneLens-Uninstall.exe','KeystoneLens-WoW-Watcher.exe'}
          with zipfile.ZipFile(sys.argv[1]) as zf:
              names = zf.namelist()
          assert 'START-COMPANION.cmd' in names and 'RUNTIME.json' in names
          assert not any(name.rsplit('/', 1)[-1] in forbidden for name in names)
          PY

      - name: Attest final draft-release payload provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Attest portable runtime with CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/KeystoneLens-Portable-*-Windows-x64.zip
          sbom-path: dist/SBOM.cdx.json

      - name: Verify final SLSA and CycloneDX attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in dist/KeystoneLens-Source-*.zip dist/KeystoneLens-Portable-*-Windows-x64.zip; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
          gh attestation verify dist/KeystoneLens-Portable-*-Windows-x64.zip --repo "$GITHUB_REPOSITORY" --predicate-type https://cyclonedx.org/bom

      - name: Create immutable-intent draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < companion/source/VERSION)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to mutate it." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "KeystoneLens ${VERSION}" --notes-file "companion/source/docs/RELEASE-NOTES-${VERSION}.md" --draft
