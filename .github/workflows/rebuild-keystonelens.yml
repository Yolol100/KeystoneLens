name: Build and stage KeystoneLens release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/rebuild-keystonelens.yml'
      - '.github/dependabot.yml'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - 'LICENSE-SCOPE.md'
      - 'README.md'
      - 'addon/KeystoneLensBridge/**'
      - 'companion/source/**'
      - 'companion/README.md'
  pull_request:
    paths:
      - '.github/workflows/rebuild-keystonelens.yml'
      - '.github/dependabot.yml'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - 'LICENSE-SCOPE.md'
      - 'README.md'
      - 'addon/KeystoneLensBridge/**'
      - 'companion/source/**'
      - 'companion/README.md'

permissions:
  contents: read

concurrency:
  group: keystonelens-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Audit repository hygiene and supply-chain policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile companion/source/scripts/audit_repository.py
          python3 companion/source/scripts/audit_repository.py
          git diff --check

      - name: Verify canonical release identity and tag parity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < companion/source/VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fx "__version__ = \"$VERSION\"" companion/source/app/keystonelens_companion/__init__.py
          grep -Fx "## Version: $VERSION" addon/KeystoneLensBridge/KeystoneLensBridge.toc
          grep -Fx "## Version: $VERSION" companion/source/data-addon/KeystoneLensCompanionData/KeystoneLensCompanionData.toc
          test -f "companion/source/docs/RELEASE-NOTES-${VERSION}.md"
          test -f "companion/source/docs/AUDIT-REPORT-${VERSION}.md"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION" || {
              echo "Tag $GITHUB_REF_NAME does not match canonical VERSION $VERSION" >&2
              exit 1
            }
          fi

      - name: Compile WoW addon Lua sources
        shell: bash
        run: |
          set -euo pipefail
          find addon/KeystoneLensBridge companion/source/data-addon/KeystoneLensCompanionData \
            -type f -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            LUA_FILE="$file" lua5.1 -e 'local f,e=loadfile(os.getenv("LUA_FILE")); assert(f,e)'
          done

      - name: Verify QR reliability baseline and sync embedded addon source
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'three-physical-pixels-per-module reliability baseline' addon/KeystoneLensBridge/Core/Transport.lua
          grep -F 'local QR_MODULE_PX = 3' addon/KeystoneLensBridge/Core/Transport.lua
          if grep -Fq 'local QR_MODULE_PX = 1' addon/KeystoneLensBridge/Core/Transport.lua; then
            echo 'QR module size regressed to the fragile one-pixel baseline.' >&2
            exit 1
          fi
          rm -rf companion/source/addon
          mkdir -p companion/source/addon
          cp -a addon/KeystoneLensBridge companion/source/addon/KeystoneLensBridge

      - name: Install runtime-parity test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('companion/source/installer/windows/requirements-runtime.lock')
          output = Path('/tmp/keystonelens-runtime-test.txt')
          packages = []
          for raw in source.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#') or line.startswith('--hash='):
                  continue
              if line.endswith('\\'):
                  line = line[:-1].rstrip()
              if line and not line.startswith('--hash='):
                  packages.append(line)
          output.write_text('\n'.join(packages) + '\n', encoding='utf-8')
          print(output.read_text(encoding='utf-8'), end='')
          PY
          python -m pip install --disable-pip-version-check 'pytest==9.0.2' -r /tmp/keystonelens-runtime-test.txt

      - name: Run full regression suite
        shell: bash
        run: |
          set -euo pipefail
          cd companion/source
          python -m pytest -q
          python -m compileall -q app/keystonelens_companion

      - name: Build release twice and prove determinism
        shell: bash
        run: |
          set -euo pipefail
          cd companion/source
          bash scripts/BUILD-RELEASE.sh
          find release -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/keystonelens-release-round1.sha256
          bash scripts/BUILD-RELEASE.sh
          find release -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/keystonelens-release-round2.sha256
          diff -u /tmp/keystonelens-release-round1.sha256 /tmp/keystonelens-release-round2.sha256

      - name: Stage verified core release payload
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < companion/source/VERSION)"
          OUT=/tmp/keystonelens-release-core
          mkdir -p "$OUT"
          cp "companion/source/release/KeystoneLens-Source-${VERSION}.zip" "$OUT/KeystoneLens-Source-${VERSION}.zip"
          cp "companion/source/release/KeystoneLensBridge-${VERSION}-CurseForge.zip" "$OUT/KeystoneLensBridge-${VERSION}-CurseForge.zip"
          cp "companion/source/docs/AUDIT-REPORT-${VERSION}.md" "$OUT/KeystoneLens-Audit-${VERSION}.md"
          cp "companion/source/docs/RELEASE-NOTES-${VERSION}.md" "$OUT/RELEASE-NOTES-${VERSION}.md"
          cp companion/source/docs/SBOM.cdx.json "$OUT/SBOM.cdx.json"

      - name: Stage exact validated Windows signing input
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          test -d companion/source/installer/windows/build/payload
          rm -rf /tmp/keystonelens-signing-input
          mkdir -p /tmp/keystonelens-signing-input
          cp -a companion/source/installer/windows/build/payload /tmp/keystonelens-signing-input/payload

      - name: Upload verified core payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keystonelens-release-core-${{ github.sha }}
          path: /tmp/keystonelens-release-core
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact Windows signing input
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keystonelens-windows-signing-input-${{ github.sha }}
          path: /tmp/keystonelens-signing-input
          if-no-files-found: error
          retention-days: 3

  portable-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build and verify portable Companion
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'portable-out'
          ./companion/source/portable/build-portable.ps1 -OutputDir $out
          $version = (Get-Content -LiteralPath companion/source/VERSION -Raw).Trim()
          $zip = Join-Path $out "KeystoneLens-Portable-$version-Windows-x64.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw 'Portable ZIP was not produced.' }
          "PORTABLE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PORTABLE_NAME=KeystoneLens-Portable-$version-Windows-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify portable archive contract
        shell: pwsh
        run: |
          $verify = Join-Path $env:RUNNER_TEMP 'portable-contract'
          Expand-Archive -LiteralPath $env:PORTABLE_ZIP -DestinationPath $verify -Force
          foreach ($required in @('START-COMPANION.cmd','portable_launcher.py','VERSION','THIRD-PARTY-NOTICES.md','runtime\python.exe','runtime\pythonw.exe','app\keystonelens_companion\__main__.py')) {
            if (-not (Test-Path -LiteralPath (Join-Path $verify $required))) { throw "Portable package missing: $required" }
          }
          foreach ($forbidden in @('KeystoneLens-Setup.exe','KeystoneLens.exe','KeystoneLens-Uninstall.exe','KeystoneLens-WoW-Watcher.exe')) {
            if (Test-Path -LiteralPath (Join-Path $verify $forbidden)) { throw "Portable package unexpectedly contains: $forbidden" }
          }
          & (Join-Path $verify 'runtime\python.exe') -I (Join-Path $verify 'portable_launcher.py') --verify
          if ($LASTEXITCODE -ne 0) { throw 'Portable archive runtime contract failed.' }
          Get-FileHash -Algorithm SHA256 -LiteralPath $env:PORTABLE_ZIP

      - name: Upload verified portable Companion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keystonelens-portable-${{ github.sha }}
          path: ${{ env.PORTABLE_ZIP }}
          if-no-files-found: error
          retention-days: 14

  attest-core:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download exact validated core payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: keystonelens-release-core-${{ github.sha }}
          path: dist

      - name: Attest tagged core release payload
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

  sign-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'

      - name: Download exact validated Windows signing input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: keystonelens-windows-signing-input-${{ github.sha }}
          path: companion/source/installer/windows/build

      - name: Fail closed when publisher signing secrets are unavailable
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.KEYSTONELENS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.KEYSTONELENS_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) { throw 'KEYSTONELENS_PFX_BASE64 is required for a public tag release.' }
          if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) { throw 'KEYSTONELENS_PFX_PASSWORD is required for a public tag release.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'keystonelens-publisher.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          } catch {
            throw 'KEYSTONELENS_PFX_BASE64 is not valid base64.'
          }
          if ((Get-Item -LiteralPath $pfx).Length -le 0) { throw 'Decoded publisher PFX is empty.' }
          "KEYSTONELENS_PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Locate Windows SDK SignTool
        shell: pwsh
        run: |
          $root = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $tool = Get-ChildItem -LiteralPath $root -Recurse -Filter signtool.exe -File |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $tool) { throw 'signtool.exe x64 was not found in the Windows SDK.' }
          $tool.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Authenticode-sign validated Windows payload and rebuild Setup
        shell: pwsh
        env:
          KEYSTONELENS_PFX_PASSWORD: ${{ secrets.KEYSTONELENS_PFX_PASSWORD }}
        run: |
          & './companion/source/installer/windows/sign-release.ps1' -PfxPath $env:KEYSTONELENS_PFX_PATH
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed.' }
          $version = (Get-Content -LiteralPath companion/source/VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version" }
          $source = Resolve-Path companion/source/installer/windows/build/KeystoneLens-Setup.exe
          New-Item -ItemType Directory -Path signed-release -Force | Out-Null
          $out = Join-Path (Resolve-Path signed-release) "KeystoneLens-Setup-v$version-Windows-x64.exe"
          Copy-Item -LiteralPath $source -Destination $out -Force
          & signtool.exe verify /pa /all /v $out
          if ($LASTEXITCODE -ne 0) { throw 'Final Setup signature verification failed.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $out
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Final Setup Authenticode status is $($signature.Status), expected Valid."
          }

      - name: Attest signed Windows installer
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: signed-release/*

      - name: Upload signed Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keystonelens-signed-windows-${{ github.sha }}
          path: signed-release
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate
      - portable-windows
      - attest-core
      - sign-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download verified core payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: keystonelens-release-core-${{ github.sha }}
          path: dist

      - name: Download verified portable Companion
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: keystonelens-portable-${{ github.sha }}
          path: dist

      - name: Download signed Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: keystonelens-signed-windows-${{ github.sha }}
          path: dist

      - name: Verify final release payload and checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < companion/source/VERSION)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test -f "dist/KeystoneLensBridge-${VERSION}-CurseForge.zip"
          test -f "dist/KeystoneLens-Source-${VERSION}.zip"
          test -f "dist/KeystoneLens-Portable-${VERSION}-Windows-x64.zip"
          test -f "dist/KeystoneLens-Setup-v${VERSION}-Windows-x64.exe"
          test -f "dist/KeystoneLens-Audit-${VERSION}.md"
          test -f "dist/RELEASE-NOTES-${VERSION}.md"
          test -f dist/SBOM.cdx.json
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd dist && sha256sum -c SHA256SUMS.txt)
          unzip -t "dist/KeystoneLensBridge-${VERSION}-CurseForge.zip" >/dev/null
          unzip -t "dist/KeystoneLens-Source-${VERSION}.zip" >/dev/null
          unzip -t "dist/KeystoneLens-Portable-${VERSION}-Windows-x64.zip" >/dev/null

      - name: Attest final draft-release payload provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Attest final runtime artifacts with CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/KeystoneLens-Source-*.zip
            dist/KeystoneLens-Portable-*-Windows-x64.zip
            dist/KeystoneLens-Setup-v*-Windows-x64.exe
          sbom-path: dist/SBOM.cdx.json

      - name: Verify final SLSA and CycloneDX attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in dist/KeystoneLens-Source-*.zip dist/KeystoneLens-Portable-*-Windows-x64.zip dist/KeystoneLens-Setup-v*-Windows-x64.exe; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" --predicate-type https://cyclonedx.org/bom
          done

      - name: Create immutable-intent draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < companion/source/VERSION)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to mutate published/draft release assets." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "KeystoneLens ${VERSION}" \
            --notes-file "companion/source/docs/RELEASE-NOTES-${VERSION}.md" \
            --draft
          echo 'Draft release created. Publish it only after the documented live WoW and clean-Windows acceptance gates pass.'
