name: CodeQL

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/codeql.yml'
      - 'addon/KeystoneLensBridge/**'
      - 'companion/source/app/**'
      - 'companion/source/installer/windows/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/codeql.yml'
      - 'addon/KeystoneLensBridge/**'
      - 'companion/source/app/**'
      - 'companion/source/installer/windows/**'
  schedule:
    - cron: '31 4 * * 2'

permissions:
  contents: read
  security-events: write

concurrency:
  group: keystonelens-codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build native Go entry points for analysis
        if: matrix.language == 'go'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf companion/source/addon
          mkdir -p companion/source/addon
          cp -a addon/KeystoneLensBridge companion/source/addon/KeystoneLensBridge
          bash companion/source/installer/windows/build.sh >/dev/null

      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: '/language:${{ matrix.language }}'
