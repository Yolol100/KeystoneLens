name: Rebuild KeystoneLens 0.12.7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-keystonelens-0127.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Apply verified source update when staged
        shell: bash
        run: |
          set -euo pipefail
          if test -f .release-update/part-00; then
            cat .release-update/part-* > /tmp/keystonelens-update.b64
            base64 -d /tmp/keystonelens-update.b64 > /tmp/keystonelens-update.tar.gz
            echo '5ba841504a8f897b096801a82f7c40b56301b28fc14da621400c259787f6a317  /tmp/keystonelens-update.tar.gz' | sha256sum -c -
            tar -xzf /tmp/keystonelens-update.tar.gz -C .
          fi
          rm -rf .release-update .keystonelens-publish

      - name: Run installer contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==9.0.2'
          rm -rf companion/source/addon
          cp -a addon companion/source/addon
          cd companion/source
          python -m pytest -q app/tests/test_release_contract.py
          python -m compileall -q app/keystonelens_companion
          rm -rf addon

      - name: Build verified Windows installer
        shell: bash
        run: |
          set -euo pipefail
          cd companion/source
          bash installer/windows/build.sh
          echo '8b779edeb71ff4d0d766311e8c3fea36fb88aa4d67845bdcf3eda9bc683e7a62  installer/windows/build/KeystoneLens-Setup.exe' | sha256sum -c -
          cp installer/windows/build/KeystoneLens-Setup.exe ../../executable/KeystoneLens-Setup-v0.12.7-Windows-x64.exe

      - name: Build deterministic source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf companion/source/addon
          mkdir -p companion/source/addon
          cp -a addon/KeystoneLensBridge companion/source/addon/KeystoneLensBridge
          python - <<'PY'
          from pathlib import Path
          import stat
          import zipfile

          root = Path('companion/source')
          out = Path('companion/KeystoneLens-Source-0.12.7.zip')
          fixed = (1980, 1, 1, 0, 0, 0)
          selected = [root / 'README-NL.md', root / 'pytest.ini', root / 'conftest.py']
          for base in [root / 'app', root / 'addon', root / 'data-addon', root / 'docs', root / 'installer' / 'windows', root / 'scripts']:
              for path in base.rglob('*'):
                  if not path.is_file():
                      continue
                  rel = path.relative_to(root).as_posix()
                  if '/build/' in '/' + rel or rel.endswith('bootstrap/payload.zip'):
                      continue
                  if '__pycache__' in path.parts or path.suffix in {'.pyc', '.pyo', '.exe', '.zip'}:
                      continue
                  selected.append(path)
          selected = sorted(set(p for p in selected if p.exists()))
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in selected:
                  rel = path.relative_to(root).as_posix()
                  info = zipfile.ZipInfo(rel, fixed)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.create_system = 3
                  mode = 0o755 if path.suffix in {'.sh', '.py'} or path.name == 'BUILD-RELEASE.sh' else 0o644
                  info.external_attr = (stat.S_IFREG | mode) << 16
                  zf.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          PY
          rm -rf companion/source/addon
          echo 'd2c27168e9559ef1bf34f834d8e4ba35391482b9bde72829fbaccd0f7254b966  companion/KeystoneLens-Source-0.12.7.zip' | sha256sum -c -

      - name: Clean build-only files and refresh checksums
        shell: bash
        run: |
          set -euo pipefail
          rm -rf companion/source/installer/windows/build
          rm -f companion/source/installer/windows/bootstrap/payload.zip
          find companion/source -type d -name '__pycache__' -prune -exec rm -rf '{}' +
          rm -rf companion/source/.pytest_cache
          find README.md addon companion executable -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          echo '8b779edeb71ff4d0d766311e8c3fea36fb88aa4d67845bdcf3eda9bc683e7a62  executable/KeystoneLens-Setup-v0.12.7-Windows-x64.exe' | grep -Fxf - SHA256SUMS.txt
          echo 'd2c27168e9559ef1bf34f834d8e4ba35391482b9bde72829fbaccd0f7254b966  companion/KeystoneLens-Source-0.12.7.zip' | grep -Fxf - SHA256SUMS.txt
          if grep -Eq '__pycache__|\.pytest_cache|\.keystonelens-publish|\.release-update' SHA256SUMS.txt; then
            echo 'Unexpected temporary path in checksum manifest.' >&2
            exit 1
          fi

      - name: Commit rebuilt 0.12.7 artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Rebuild KeystoneLens 0.12.7 installer artifacts'
          git push origin HEAD:main
