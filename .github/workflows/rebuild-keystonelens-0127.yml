name: Rebuild KeystoneLens 0.12.7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-keystonelens-0127.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Apply verified source update when staged
        shell: bash
        run: |
          set -euo pipefail
          if test -f .release-update/part-00; then
            cat .release-update/part-* > /tmp/keystonelens-update.patch
            echo 'efb6aba514e8d874f8368f35c6fa50463d8206dff86ac85a64d2181d9e310cbd  /tmp/keystonelens-update.patch' | sha256sum -c -
            echo 'd2c27168e9559ef1bf34f834d8e4ba35391482b9bde72829fbaccd0f7254b966  companion/KeystoneLens-Source-0.12.7.zip' | sha256sum -c -
            echo 'ce3da2e9c18b16deb735ef5be5a164930c9a0eb191753ab83ea4d939319c7ccc  addon/KeystoneLensBridge-0.12.7-CurseForge.zip' | sha256sum -c -
            echo '8b779edeb71ff4d0d766311e8c3fea36fb88aa4d67845bdcf3eda9bc683e7a62  executable/KeystoneLens-Setup-v0.12.7-Windows-x64.exe' | sha256sum -c -
            rm -rf companion/source/addon
            mkdir -p companion/source/addon
            cp -a addon/KeystoneLensBridge companion/source/addon/KeystoneLensBridge
            patch --dry-run --batch --forward -p1 -d companion/source < /tmp/keystonelens-update.patch
            patch --batch --forward -p1 -d companion/source < /tmp/keystonelens-update.patch
            cp companion/source/addon/KeystoneLensBridge/Core/Transport.lua addon/KeystoneLensBridge/Core/Transport.lua
          else
            rm -rf companion/source/addon
            mkdir -p companion/source/addon
            cp -a addon/KeystoneLensBridge companion/source/addon/KeystoneLensBridge
          fi

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==9.0.2' -r companion/source/app/requirements.txt

      - name: Run full regression round one
        shell: bash
        run: |
          set -euo pipefail
          cd companion/source
          python -m pytest -q
          python -m compileall -q app/keystonelens_companion

      - name: Build and verify complete release round two
        shell: bash
        run: |
          set -euo pipefail
          cd companion/source
          bash scripts/BUILD-RELEASE.sh
          echo 'bbd0844b2e4d4594263b7625ed936b0ddebb1d29695d712a5cee42f2be212387  release/KeystoneLens-Setup-0.12.7.exe' | sha256sum -c -
          echo 'c20891377efae692e5e760cccecafa1ff5d3cd3d6e27ccbc9a58cc61d5a2bb2c  release/KeystoneLens-Source-0.12.7.zip' | sha256sum -c -
          echo 'bbb180451cc972d7fffd51256a839518fe5cc54e52366888b41188f717b9ed66  release/KeystoneLensBridge-0.12.7-CurseForge.zip' | sha256sum -c -
          echo '5cdfeec3ec1f9e63fa980a32c091fc37ee2277e03d22e0f054f1247fed4f584c  release/KeystoneLens-Release-0.12.7.zip' | sha256sum -c -

      - name: Publish verified repository artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp companion/source/release/KeystoneLens-Setup-0.12.7.exe executable/KeystoneLens-Setup-v0.12.7-Windows-x64.exe
          cp companion/source/release/KeystoneLens-Source-0.12.7.zip companion/KeystoneLens-Source-0.12.7.zip
          cp companion/source/release/KeystoneLensBridge-0.12.7-CurseForge.zip addon/KeystoneLensBridge-0.12.7-CurseForge.zip
          cp companion/source/docs/AUDIT-REPORT.md companion/KeystoneLens-Audit-0.12.7.md

      - name: Clean build-only files and refresh checksums
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-update .keystonelens-publish
          rm -rf companion/source/addon
          rm -rf companion/source/release
          rm -rf companion/source/installer/windows/build
          rm -f companion/source/installer/windows/bootstrap/payload.zip
          find companion/source -type d -name '__pycache__' -prune -exec rm -rf '{}' +
          rm -rf companion/source/.pytest_cache
          find README.md addon companion executable -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          echo 'bbd0844b2e4d4594263b7625ed936b0ddebb1d29695d712a5cee42f2be212387  executable/KeystoneLens-Setup-v0.12.7-Windows-x64.exe' | grep -Fxf - SHA256SUMS.txt
          echo 'c20891377efae692e5e760cccecafa1ff5d3cd3d6e27ccbc9a58cc61d5a2bb2c  companion/KeystoneLens-Source-0.12.7.zip' | grep -Fxf - SHA256SUMS.txt
          echo 'bbb180451cc972d7fffd51256a839518fe5cc54e52366888b41188f717b9ed66  addon/KeystoneLensBridge-0.12.7-CurseForge.zip' | grep -Fxf - SHA256SUMS.txt
          if grep -Eq '__pycache__|\.pytest_cache|\.keystonelens-publish|\.release-update|companion/source/release' SHA256SUMS.txt; then
            echo 'Unexpected temporary path in checksum manifest.' >&2
            exit 1
          fi

      - name: Commit rebuilt 0.12.7 artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Rebuild KeystoneLens 0.12.7 verified artifacts'
          git push origin HEAD:main
