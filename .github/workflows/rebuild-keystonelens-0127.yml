name: Rebuild KeystoneLens 0.12.7

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rebuild-keystonelens-0127.yml'
      - 'addon/KeystoneLensBridge/**'
      - 'companion/source/**'

permissions:
  contents: read

concurrency:
  group: keystonelens-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Compile WoW addon Lua sources
        shell: bash
        run: |
          set -euo pipefail
          find addon/KeystoneLensBridge companion/source/data-addon/KeystoneLensCompanionData \
            -type f -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            LUA_FILE="$file" lua5.1 -e 'local f,e=loadfile(os.getenv("LUA_FILE")); assert(f,e)'
          done

      - name: Verify QR reliability baseline and sync addon source
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'three-physical-pixels-per-module reliability baseline' addon/KeystoneLensBridge/Core/Transport.lua
          if grep -Fq 'one-physical-pixel-per-module' addon/KeystoneLensBridge/Core/Transport.lua; then
            echo 'Stale one-pixel QR documentation returned.' >&2
            exit 1
          fi
          grep -F 'local QR_MODULE_PX = 3' addon/KeystoneLensBridge/Core/Transport.lua
          if grep -Fq 'local QR_MODULE_PX = 1' addon/KeystoneLensBridge/Core/Transport.lua; then
            echo 'QR module size regressed to the fragile one-pixel baseline.' >&2
            exit 1
          fi
          rm -rf companion/source/addon
          mkdir -p companion/source/addon
          cp -a addon/KeystoneLensBridge companion/source/addon/KeystoneLensBridge

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==9.0.2' -r companion/source/app/requirements.txt

      - name: Run regression suite
        shell: bash
        run: |
          set -euo pipefail
          cd companion/source
          python -m pytest -q
          python -m compileall -q app/keystonelens_companion
          grep -F 'local QR_MODULE_PX = 3' addon/KeystoneLensBridge/Core/Transport.lua

      - name: Build release twice and prove determinism
        shell: bash
        run: |
          set -euo pipefail
          cd companion/source
          bash scripts/BUILD-RELEASE.sh
          find release -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/keystonelens-release-round1.sha256
          bash scripts/BUILD-RELEASE.sh
          find release -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/keystonelens-release-round2.sha256
          diff -u /tmp/keystonelens-release-round1.sha256 /tmp/keystonelens-release-round2.sha256

      - name: Stage verified publish payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/keystonelens-publish
          cp companion/source/release/KeystoneLens-Setup-0.12.7.exe /tmp/keystonelens-publish/KeystoneLens-Setup-v0.12.7-Windows-x64.exe
          cp companion/source/release/KeystoneLens-Source-0.12.7.zip /tmp/keystonelens-publish/KeystoneLens-Source-0.12.7.zip
          cp companion/source/release/KeystoneLensBridge-0.12.7-CurseForge.zip /tmp/keystonelens-publish/KeystoneLensBridge-0.12.7-CurseForge.zip
          cp companion/source/docs/AUDIT-REPORT.md /tmp/keystonelens-publish/KeystoneLens-Audit-0.12.7.md

      - name: Upload verified publish payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keystonelens-verified-publish-${{ github.sha }}
          path: /tmp/keystonelens-publish
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download verified publish payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: keystonelens-verified-publish-${{ github.sha }}
          path: /tmp/keystonelens-publish

      - name: Publish verified repository artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/keystonelens-publish/KeystoneLens-Setup-v0.12.7-Windows-x64.exe executable/KeystoneLens-Setup-v0.12.7-Windows-x64.exe
          cp /tmp/keystonelens-publish/KeystoneLens-Source-0.12.7.zip companion/KeystoneLens-Source-0.12.7.zip
          cp /tmp/keystonelens-publish/KeystoneLensBridge-0.12.7-CurseForge.zip addon/KeystoneLensBridge-0.12.7-CurseForge.zip
          cp /tmp/keystonelens-publish/KeystoneLens-Audit-0.12.7.md companion/KeystoneLens-Audit-0.12.7.md
          find README.md addon companion executable -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          if grep -Eq '__pycache__|\.pytest_cache|\.keystonelens-publish|\.release-update|companion/source/release' SHA256SUMS.txt; then
            echo 'Unexpected temporary path in checksum manifest.' >&2
            exit 1
          fi
          sha256sum -c SHA256SUMS.txt

      - name: Commit verified rebuilt artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Rebuild verified KeystoneLens artifacts'
          git push origin "HEAD:refs/heads/main"
