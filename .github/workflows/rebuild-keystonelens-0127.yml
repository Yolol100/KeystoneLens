name: Rebuild KeystoneLens 0.12.7

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/harden-keystonelens
    paths:
      - '.github/workflows/rebuild-keystonelens-0127.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Apply QR reliability baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('addon/KeystoneLensBridge/Core/Transport.lua')
          text = path.read_text(encoding='utf-8')
          old = 'local QR_MODULE_PX = 1                 -- smallest physical-pixel module; visible only during the capture lease'
          new = 'local QR_MODULE_PX = 3                 -- reliability baseline proven for live screenshot transport'
          if new not in text:
              if old not in text:
                  raise SystemExit('QR module-size source contract not found')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -F 'local QR_MODULE_PX = 3' addon/KeystoneLensBridge/Core/Transport.lua
          rm -rf companion/source/addon
          mkdir -p companion/source/addon
          cp -a addon/KeystoneLensBridge companion/source/addon/KeystoneLensBridge

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==9.0.2' -r companion/source/app/requirements.txt

      - name: Run regression suite
        shell: bash
        run: |
          set -euo pipefail
          cd companion/source
          python -m pytest -q
          python -m compileall -q app/keystonelens_companion
          grep -F 'local QR_MODULE_PX = 3' addon/KeystoneLensBridge/Core/Transport.lua

      - name: Build release twice and prove determinism
        shell: bash
        run: |
          set -euo pipefail
          cd companion/source
          bash scripts/BUILD-RELEASE.sh
          find release -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/keystonelens-release-round1.sha256
          bash scripts/BUILD-RELEASE.sh
          find release -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/keystonelens-release-round2.sha256
          diff -u /tmp/keystonelens-release-round1.sha256 /tmp/keystonelens-release-round2.sha256

      - name: Publish verified repository artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp companion/source/release/KeystoneLens-Setup-0.12.7.exe executable/KeystoneLens-Setup-v0.12.7-Windows-x64.exe
          cp companion/source/release/KeystoneLens-Source-0.12.7.zip companion/KeystoneLens-Source-0.12.7.zip
          cp companion/source/release/KeystoneLensBridge-0.12.7-CurseForge.zip addon/KeystoneLensBridge-0.12.7-CurseForge.zip
          cp companion/source/docs/AUDIT-REPORT.md companion/KeystoneLens-Audit-0.12.7.md

      - name: Clean build-only files and refresh checksums
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-update .keystonelens-publish
          rm -rf companion/source/addon
          rm -rf companion/source/release
          rm -rf companion/source/installer/windows/build
          rm -f companion/source/installer/windows/bootstrap/payload.zip
          find companion/source -type d -name '__pycache__' -prune -exec rm -rf '{}' +
          rm -rf companion/source/.pytest_cache
          find README.md addon companion executable -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          if grep -Eq '__pycache__|\.pytest_cache|\.keystonelens-publish|\.release-update|companion/source/release' SHA256SUMS.txt; then
            echo 'Unexpected temporary path in checksum manifest.' >&2
            exit 1
          fi

      - name: Commit verified transport fix and rebuilt artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Harden KeystoneLens QR transport reliability'
          git push origin "HEAD:${GITHUB_REF_NAME}"
