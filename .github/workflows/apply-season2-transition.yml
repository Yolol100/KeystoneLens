name: Apply Season 2 transition patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.15'

      - name: Apply verified source patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'MIDNIGHT_SEASON_2_WEEK2_START' companion/source/app/keystonelens_companion/registries.py; then
            echo 'Season transition source is already applied.'
            exit 0
          fi
          for part in 00 01 02 03 04; do
            test -f "scripts/season2-transition.part${part}" || {
              echo 'Patch staging is not complete yet.'
              exit 0
            }
          done
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path
          import subprocess

          encoded = ''.join(
              Path(f'scripts/season2-transition.part{part}').read_text(encoding='utf-8').strip()
              for part in ('00', '01', '02', '03', '04')
          )
          patch = gzip.decompress(base64.b64decode(encoded))
          subprocess.run(['git', 'apply', '--index', '--whitespace=error', '-'], input=patch, check=True)
          PY
          git diff --cached --check
          python -m py_compile companion/source/app/keystonelens_companion/*.py companion/source/app/tests/test_season_transition.py

      - name: Commit applied source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add Season 2 week-one carry-over'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
