name: Validate KeystoneLens deterministic release fix

on:
  push:
    branches:
      - agent/audit-fixes-20260816
    paths:
      - '.github/workflows/agent-release-debug.yml'

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/audit-fixes-20260816
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Prepare exact release inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf companion/source/addon
          mkdir -p companion/source/addon
          cp -a addon/KeystoneLensBridge companion/source/addon/KeystoneLensBridge
          python -m pip install --disable-pip-version-check -q 'pytest==9.0.2' -r companion/source/app/requirements.txt
      - name: Build twice and prove deterministic output
        shell: bash
        run: |
          set -euo pipefail
          cd companion/source
          bash scripts/BUILD-RELEASE.sh
          find release -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/kl-round1.sha256
          bash scripts/BUILD-RELEASE.sh
          find release -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/kl-round2.sha256
          diff -u /tmp/kl-round1.sha256 /tmp/kl-round2.sha256
