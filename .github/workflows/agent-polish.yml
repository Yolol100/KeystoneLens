name: Apply KeystoneLens polish

on:
  push:
    branches:
      - agent/frontend-backend-polish
    paths:
      - '.github/workflows/agent-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontend-backend-polish
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply frontend and backend polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_all(path, replacements):
              text = Path(path).read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old!r}')
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'no changes made to {path}')
              Path(path).write_text(text, encoding='utf-8')

          ui = 'companion/source/app/keystonelens_companion/ui.py'
          replace_all(ui, [
              ('("score", "KL ↓", 66, "w")', '("score", "Score ↓", 66, "w")'),
              ('("player", "Player", 110, "w")', '("player", "Applicant", 110, "w")'),
              ('return "Choose the WoW Screenshots folder first."', 'return "Select your WoW Screenshots folder."'),
              ('return "The selected Screenshots location is not a folder."', 'return "Select a valid Screenshots folder."'),
              ('return "Enter both the Warcraft Logs Client ID and Client Secret, or leave both empty."', 'return "Enter both Warcraft Logs credentials, or leave both fields empty."'),
              ('text="Overlay columns"', 'text="Visible columns"'),
              ('text="Hide optional data without changing the KL score calculation."', 'text="Show or hide columns without changing the KL Score."'),
              ('("show_role", "Role", "Also controls the role filter")', '("show_role", "Role", "Show the Role column and filter")'),
              ('("show_class", "Class", "Also controls the class filter")', '("show_class", "Class", "Show the Class column and filter")'),
              ('("show_spec", "Spec", "Specialization column")', '("show_spec", "Spec", "Show the Specialization column")'),
              ('("show_rio", "Raider.IO", "Hide rating details only")', '("show_rio", "Raider.IO", "Show Raider.IO details")'),
              ('("show_wcl", "Warcraft Logs", "Hide WCL details only")', '("show_wcl", "Warcraft Logs", "Show Warcraft Logs details")'),
              ('"Settings could not be saved. Check the main window status and try again."', '"Couldn’t save settings. Check the main window status, then try again."'),
              ('text="Open your Mythic+ Group Finder listing"', 'text="Open a Mythic+ Group Finder listing"'),
              ('text="KeystoneLens automatically imports applicants.\\nNo manual refresh needed."', 'text="Applicants appear automatically as they apply."'),
              ('self.empty.winfo_children()[0].configure(text="Open your Mythic+ Group Finder listing")', 'self.empty.winfo_children()[0].configure(text="Open a Mythic+ Group Finder listing")'),
              ('text="KeystoneLens automatically imports applicants.\\nNo manual refresh needed."', 'text="Applicants appear automatically as they apply."'),
              ('self.empty.winfo_children()[0].configure(text="Waiting for players")', 'self.empty.winfo_children()[0].configure(text="Waiting for applicants")'),
              ('count_text = f"{shown} / {eligible_total} players"', 'count_text = f"{shown} / {eligible_total} applicants"'),
              ('count_text = f"{eligible_total} player{\'s\' if eligible_total != 1 else \'\'}"', 'count_text = f"{eligible_total} applicant{\'s\' if eligible_total != 1 else \'\'}"'),
              ('empty_text = "No players match the current filters" if eligible_total else "Waiting for final KL scores"', 'empty_text = "No applicants match these filters" if eligible_total else "Calculating KL scores…"'),
              ('text=f"{view.applicant.name}   KL {score.score}/100 · {score.label} · confidence {score.confidence}"', 'text=f"{view.applicant.name}   KL {score.score}/100 · {score.label.title()} · {score.confidence.title()} confidence"'),
              ('f"RIO {score.rio_score:.0f}/100 (50%)"', 'f"Raider.IO {score.rio_score:.0f}/100 · 50%"'),
              ('"WCL 0/100 (50% · no data)"', '"Warcraft Logs 0/100 · 50% · No public data"'),
              ('f"WCL {score.wcl_score:.0f}/100 (50%)"', 'f"Warcraft Logs {score.wcl_score:.0f}/100 · 50%"'),
              ('"Final KL appears after online enrichment is complete."', '"KL Score appears when Raider.IO and Warcraft Logs finish loading."'),
              ('"WCL staat off; het vaste WCL-deel van 50% blijft daardoor 0/100."', '"Warcraft Logs is off. Its fixed 50% share remains 0/100."'),
              ('"WCL: no usable public ranking; its fixed 50% share is 0/100."', '"Warcraft Logs: no usable public ranking; its fixed 50% share is 0/100."'),
          ])

          engine = Path('companion/source/app/keystonelens_companion/engine.py')
          text = engine.read_text(encoding='utf-8')
          anchor = 'from .util import realm_slug, split_name_realm\n\n\nclass ApplicantEngine:'
          helper = '''from .util import realm_slug, split_name_realm\n\n\ndef _listing_context(value: Listing | None) -> tuple[str, int]:\n    """Return the stable enrichment identity for a listing."""\n    if value is None:\n        return ("", 0)\n    return (value.dungeon_name.casefold(), int(value.key_level or 0))\n\n\ndef _same_character_context(old: ApplicantView | None, applicant, listing: Listing | None, region: str) -> bool:\n    """Keep enrichment only when character and listing context are unchanged."""\n    return bool(\n        old\n        and old.applicant.name == applicant.name\n        and old.applicant.spec_id == applicant.spec_id\n        and old.applicant.role_byte == applicant.role_byte\n        and _listing_context(old.snapshot_listing) == _listing_context(listing)\n        and old.region == region\n    )\n\n\ndef _result_matches_listing(result: WCLResult | RIOResult | None, listing: Listing | None) -> bool:\n    """Validate cached online evidence against the current listing context."""\n    return bool(\n        result\n        and not result.error\n        and listing is not None\n        and result.dungeon_name == listing.dungeon_name\n        and result.target_key == int(listing.key_level or 0)\n    )\n\n\nclass ApplicantEngine:'''
          if anchor not in text:
              raise SystemExit('engine helper insertion anchor missing')
          text = text.replace(anchor, helper, 1)
          old_block = '''            def enrichment_context(value: Listing | None) -> tuple[str, int]:\n                if value is None:\n                    return ("", 0)\n                return (value.dungeon_name.casefold(), int(value.key_level or 0))\n\n            new_enrichment_context = enrichment_context(effective_listing)\n            if (enrichment_context(old_listing), old_region) != (new_enrichment_context, region):'''
          new_block = '''            new_enrichment_context = _listing_context(effective_listing)\n            if (_listing_context(old_listing), old_region) != (new_enrichment_context, region):'''
          if old_block not in text:
              raise SystemExit('engine context block missing')
          text = text.replace(old_block, new_block, 1)
          old_context = '''                same_character_context = bool(\n                    old\n                    and old.applicant.name == applicant.name\n                    and old.applicant.spec_id == applicant.spec_id\n                    and old.applicant.role_byte == applicant.role_byte\n                    and enrichment_context(old.snapshot_listing) == new_enrichment_context\n                    and old.region == region\n                )\n                same_wcl_context = bool(\n                    same_character_context\n                    and old.wcl\n                    and not old.wcl.error\n                    and old.wcl.dungeon_name == (effective_listing.dungeon_name if effective_listing else "")\n                    and old.wcl.target_key == (effective_listing.key_level if effective_listing else 0)\n                )\n                same_rio_context = bool(\n                    same_character_context\n                    and old.rio\n                    and not old.rio.error\n                    and old.rio.dungeon_name == (effective_listing.dungeon_name if effective_listing else "")\n                    and old.rio.target_key == (effective_listing.key_level if effective_listing else 0)\n                )'''
          new_context = '''                same_character_context = _same_character_context(old, applicant, effective_listing, region)\n                same_wcl_context = bool(same_character_context and _result_matches_listing(old.wcl, effective_listing))\n                same_rio_context = bool(same_character_context and _result_matches_listing(old.rio, effective_listing))'''
          if old_context not in text:
              raise SystemExit('engine duplicate context block missing')
          text = text.replace(old_context, new_context, 1)
          text = text.replace('self._status = "Open your Mythic+ Group Finder listing"', 'self._status = "Open a Mythic+ Group Finder listing"')
          text = text.replace('"Group Finder temporarily limited • keeping last valid list"', '"Group Finder data temporarily unavailable • keeping last valid list"')
          text = text.replace('"Group Finder temporarily unreadable • keeping last valid list"', '"Group Finder data temporarily unavailable • keeping last valid list"')
          text = text.replace('"Waiting for players" if not new_views else f"{len(new_views)} players • {region}"', '"Waiting for applicants" if not new_views else f"{len(new_views)} applicants • {region}"')
          text = text.replace('f"{len(self._views)} players • partial snapshot • {region}"', 'f"{len(self._views)} applicants • partial data • {region}"')
          engine.write_text(text, encoding='utf-8')

          rio = Path('companion/source/app/keystonelens_companion/rio.py')
          text = rio.read_text(encoding='utf-8')
          replacements = [
              ('if time.time() < self._blocked_until:', 'if time.monotonic() < self._blocked_until:'),
              ('delay = MIN_REQUEST_INTERVAL_SECONDS - (time.time() - self._last_request_at)', 'delay = MIN_REQUEST_INTERVAL_SECONDS - (time.monotonic() - self._last_request_at)'),
              ('self._last_request_at = time.time()', 'self._last_request_at = time.monotonic()'),
              ('self._blocked_until = time.time() + self._retry_after(response)', 'self._blocked_until = time.monotonic() + self._retry_after(response)'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'rio monotonic anchor missing: {old}')
              text = text.replace(old, new)
          rio.write_text(text, encoding='utf-8')
          PY
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest -r companion/source/app/requirements.txt
      - name: Run companion regression tests
        working-directory: companion/source
        run: |
          python -m pytest -q
          python -m compileall -q app/keystonelens_companion
      - name: Commit polished implementation
        shell: bash
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add companion/source/app/keystonelens_companion/ui.py companion/source/app/keystonelens_companion/engine.py companion/source/app/keystonelens_companion/rio.py
          git diff --cached --check
          git commit -m 'Polish existing frontend and backend behavior'
          git push origin HEAD:agent/frontend-backend-polish
