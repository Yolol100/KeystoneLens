name: Apply KeystoneLens verified polish

on:
  push:
    branches: [agent/frontend-backend-polish]
    paths: ['.github/workflows/agent-polish-final.yml']

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontend-backend-polish
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply existing-behavior polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('companion/source/app/keystonelens_companion/ui.py')
          text = p.read_text(encoding='utf-8')
          replacements = [
              ('("score", "KL ↓", 66, "w")', '("score", "Score ↓", 66, "w")'),
              ('("player", "Player", 110, "w")', '("player", "Applicant", 110, "w")'),
              ('Choose the WoW Screenshots folder first.', 'Select your WoW Screenshots folder.'),
              ('The selected Screenshots location is not a folder.', 'Select a valid Screenshots folder.'),
              ('Enter both the Warcraft Logs Client ID and Client Secret, or leave both empty.', 'Enter both Warcraft Logs credentials, or leave both fields empty.'),
              ('Overlay columns', 'Visible columns'),
              ('Hide optional data without changing the KL score calculation.', 'Show or hide columns without changing the KL Score.'),
              ('Also controls the role filter', 'Show the Role column and filter'),
              ('Also controls the class filter', 'Show the Class column and filter'),
              ('Specialization column', 'Show the Specialization column'),
              ('Hide rating details only', 'Show Raider.IO details'),
              ('Hide WCL details only', 'Show Warcraft Logs details'),
              ('Settings could not be saved. Check the main window status and try again.', 'Couldn’t save settings. Check the main window status, then try again.'),
              ('Open your Mythic+ Group Finder listing', 'Open a Mythic+ Group Finder listing'),
              ('KeystoneLens automatically imports applicants.\\nNo manual refresh needed.', 'Applicants appear automatically as they apply.'),
              ('Waiting for players', 'Waiting for applicants'),
              ('{shown} / {eligible_total} players', '{shown} / {eligible_total} applicants'),
              ('{eligible_total} player{\'s\' if eligible_total != 1 else \'\'}', '{eligible_total} applicant{\'s\' if eligible_total != 1 else \'\'}'),
              ('No players match the current filters', 'No applicants match these filters'),
              ('Waiting for final KL scores', 'Calculating KL scores…'),
              ('KL {score.score}/100 · {score.label} · confidence {score.confidence}', 'KL {score.score}/100 · {score.label.title()} · {score.confidence.title()} confidence'),
              ('RIO {score.rio_score:.0f}/100 (50%)', 'Raider.IO {score.rio_score:.0f}/100 · 50%'),
              ('WCL {score.wcl_score:.0f}/100 (50%)', 'Warcraft Logs {score.wcl_score:.0f}/100 · 50%'),
              ('WCL 0/100 (50% · no data)', 'Warcraft Logs 0/100 · 50% · No public data'),
              ('Final KL appears after online enrichment is complete.', 'KL Score appears when Raider.IO and Warcraft Logs finish loading.'),
              ('WCL staat off; het vaste WCL-deel van 50% blijft daardoor 0/100.', 'Warcraft Logs is off. Its fixed 50% share remains 0/100.'),
              ('WCL: no usable public ranking; its fixed 50% share is 0/100.', 'Warcraft Logs: no usable public ranking; its fixed 50% share is 0/100.'),
          ]
          matched = 0
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
                  matched += 1
          if matched < 22:
              raise SystemExit(f'UI polish matched only {matched} expected strings')
          p.write_text(text, encoding='utf-8')

          p = Path('companion/source/app/keystonelens_companion/engine.py')
          text = p.read_text(encoding='utf-8')
          class_anchor = '\n\nclass ApplicantEngine:'
          if class_anchor not in text:
              raise SystemExit('ApplicantEngine class anchor missing')
          helpers = '''\n\ndef _listing_context(value: Listing | None) -> tuple[str, int]:\n    """Return the stable enrichment identity for a listing."""\n    if value is None:\n        return ("", 0)\n    return (value.dungeon_name.casefold(), int(value.key_level or 0))\n\n\ndef _same_character_context(old: ApplicantView | None, applicant, listing: Listing | None, region: str) -> bool:\n    """Keep enrichment only when character and listing context are unchanged."""\n    return bool(\n        old\n        and old.applicant.name == applicant.name\n        and old.applicant.spec_id == applicant.spec_id\n        and old.applicant.role_byte == applicant.role_byte\n        and _listing_context(old.snapshot_listing) == _listing_context(listing)\n        and old.region == region\n    )\n\n\ndef _result_matches_listing(result: WCLResult | RIOResult | None, listing: Listing | None) -> bool:\n    """Validate cached online evidence against the current listing context."""\n    return bool(\n        result\n        and not result.error\n        and listing is not None\n        and result.dungeon_name == listing.dungeon_name\n        and result.target_key == int(listing.key_level or 0)\n    )\n'''
          text = text.replace(class_anchor, helpers + class_anchor, 1)
          old_context_fn = '''            def enrichment_context(value: Listing | None) -> tuple[str, int]:\n                if value is None:\n                    return ("", 0)\n                return (value.dungeon_name.casefold(), int(value.key_level or 0))\n\n            new_enrichment_context = enrichment_context(effective_listing)\n            if (enrichment_context(old_listing), old_region) != (new_enrichment_context, region):'''
          new_context_fn = '''            new_enrichment_context = _listing_context(effective_listing)\n            if (_listing_context(old_listing), old_region) != (new_enrichment_context, region):'''
          if old_context_fn not in text:
              raise SystemExit('inline listing context block missing')
          text = text.replace(old_context_fn, new_context_fn, 1)
          old_reuse = '''                same_character_context = bool(\n                    old\n                    and old.applicant.name == applicant.name\n                    and old.applicant.spec_id == applicant.spec_id\n                    and old.applicant.role_byte == applicant.role_byte\n                    and enrichment_context(old.snapshot_listing) == new_enrichment_context\n                    and old.region == region\n                )\n                same_wcl_context = bool(\n                    same_character_context\n                    and old.wcl\n                    and not old.wcl.error\n                    and old.wcl.dungeon_name == (effective_listing.dungeon_name if effective_listing else "")\n                    and old.wcl.target_key == (effective_listing.key_level if effective_listing else 0)\n                )\n                same_rio_context = bool(\n                    same_character_context\n                    and old.rio\n                    and not old.rio.error\n                    and old.rio.dungeon_name == (effective_listing.dungeon_name if effective_listing else "")\n                    and old.rio.target_key == (effective_listing.key_level if effective_listing else 0)\n                )'''
          new_reuse = '''                same_character_context = _same_character_context(old, applicant, effective_listing, region)\n                same_wcl_context = bool(same_character_context and _result_matches_listing(old.wcl, effective_listing))\n                same_rio_context = bool(same_character_context and _result_matches_listing(old.rio, effective_listing))'''
          if old_reuse not in text:
              raise SystemExit('duplicated enrichment context block missing')
          text = text.replace(old_reuse, new_reuse, 1)
          for old, new in [
              ('Open your Mythic+ Group Finder listing', 'Open a Mythic+ Group Finder listing'),
              ('Group Finder temporarily limited • keeping last valid list', 'Group Finder data temporarily unavailable • keeping last valid list'),
              ('Group Finder temporarily unreadable • keeping last valid list', 'Group Finder data temporarily unavailable • keeping last valid list'),
              ('Waiting for players', 'Waiting for applicants'),
              (' players • {region}', ' applicants • {region}'),
              (' players • partial snapshot • {region}', ' applicants • partial data • {region}'),
          ]:
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')

          p = Path('companion/source/app/keystonelens_companion/rio.py')
          text = p.read_text(encoding='utf-8')
          replacements = [
              ('if time.time() < self._blocked_until:', 'if time.monotonic() < self._blocked_until:'),
              ('delay = MIN_REQUEST_INTERVAL_SECONDS - (time.time() - self._last_request_at)', 'delay = MIN_REQUEST_INTERVAL_SECONDS - (time.monotonic() - self._last_request_at)'),
              ('self._last_request_at = time.time()', 'self._last_request_at = time.monotonic()'),
              ('self._blocked_until = time.time() + self._retry_after(response)', 'self._blocked_until = time.monotonic() + self._retry_after(response)'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'RIO pacing anchor missing: {old}')
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==9.0.2' -r companion/source/app/requirements.txt
      - name: Validate
        working-directory: companion/source
        run: |
          python -m pytest -q
          python -m compileall -q app/keystonelens_companion
      - name: Commit implementation
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add companion/source/app/keystonelens_companion/ui.py companion/source/app/keystonelens_companion/engine.py companion/source/app/keystonelens_companion/rio.py
          git diff --cached --check
          git commit -m 'Polish existing frontend and backend behavior'
          git push origin HEAD:agent/frontend-backend-polish
