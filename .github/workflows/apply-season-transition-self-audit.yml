name: Apply season transition self-audit

on:
  push:
    branches:
      - agent/season-transition-self-audit-work-20260819
    paths:
      - 'scripts/apply-season-transition-self-audit.py'
      - '.github/workflows/apply-season-transition-self-audit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/season-transition-self-audit-work-20260819
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.15'

      - name: Apply guarded audit fixes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-season-transition-self-audit.py
          git diff --check
          python -m py_compile companion/source/app/keystonelens_companion/*.py companion/source/app/tests/test_season_transition.py

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add companion/source/app/keystonelens_companion companion/source/app/tests/test_season_transition.py
          git commit -m 'Harden Season 2 transition after self-audit'
          git push origin "HEAD:${GITHUB_REF_NAME}"
