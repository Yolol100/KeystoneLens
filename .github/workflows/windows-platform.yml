name: Windows platform validation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-platform.yml'
      - 'addon/**'
      - 'companion/source/app/**'
      - 'companion/source/installer/windows/**'
  pull_request:
    paths:
      - '.github/workflows/windows-platform.yml'
      - 'addon/**'
      - 'companion/source/app/**'
      - 'companion/source/installer/windows/**'

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'

      - name: Install exact production runtime and test runner
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check 'pytest==9.0.2'
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --no-deps -r companion/source/installer/windows/requirements-runtime.lock

      - name: Sync canonical Bridge test source
        shell: pwsh
        run: |
          $target = 'companion/source/addon'
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          New-Item -ItemType Directory -Path $target | Out-Null
          Copy-Item -LiteralPath 'addon/KeystoneLensBridge' -Destination $target -Recurse
          if (-not (Test-Path -LiteralPath 'companion/source/addon/KeystoneLensBridge/KeystoneLensBridge.toc' -PathType Leaf)) {
            throw 'Canonical Bridge test source sync failed.'
          }

      - name: Run full companion suite on native Windows
        shell: pwsh
        run: |
          Set-Location companion/source
          python -m pytest -q
          python -m compileall -q app/keystonelens_companion

      - name: Parse PowerShell installer scripts
        shell: pwsh
        run: |
          $files = @(
            'companion/source/installer/windows/bootstrap/installer.ps1',
            'companion/source/installer/windows/sign-release.ps1',
            'companion/source/installer/windows/verify-signatures.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              throw "PowerShell parser rejected $file"
            }
          }

      - name: Vet native Windows Go entry points
        shell: pwsh
        env:
          GO111MODULE: 'off'
          CGO_ENABLED: '0'
        run: |
          go vet companion/source/installer/windows/launcher/main.go
          go vet companion/source/installer/windows/uninstall/main.go
          go vet companion/source/installer/windows/wowwatcher/main.go

      - name: Build native Windows executables
        shell: pwsh
        env:
          GO111MODULE: 'off'
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags '-H=windowsgui -s -w' -o "$env:RUNNER_TEMP\KeystoneLens.exe" companion/source/installer/windows/launcher/main.go
          go build -trimpath -ldflags '-H=windowsgui -s -w' -o "$env:RUNNER_TEMP\KeystoneLens-Uninstall.exe" companion/source/installer/windows/uninstall/main.go
          go build -trimpath -ldflags '-H=windowsgui -s -w' -o "$env:RUNNER_TEMP\KeystoneLens-WoW-Watcher.exe" companion/source/installer/windows/wowwatcher/main.go
          Get-Item "$env:RUNNER_TEMP\KeystoneLens.exe", "$env:RUNNER_TEMP\KeystoneLens-Uninstall.exe", "$env:RUNNER_TEMP\KeystoneLens-WoW-Watcher.exe" | ForEach-Object {
            if ($_.Length -le 0) { throw "Empty executable: $($_.FullName)" }
          }
