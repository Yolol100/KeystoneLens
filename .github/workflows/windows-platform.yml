name: Windows platform validation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-platform.yml'
      - 'addon/**'
      - 'companion/source/app/**'
      - 'companion/source/portable/**'
      - 'companion/source/runtime/windows/**'
  pull_request:
    paths:
      - '.github/workflows/windows-platform.yml'
      - 'addon/**'
      - 'companion/source/app/**'
      - 'companion/source/portable/**'
      - 'companion/source/runtime/windows/**'

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read canonical runtime version
        id: runtime
        shell: pwsh
        run: |
          $spec = Get-Content -LiteralPath companion/source/runtime/windows/python-runtime.json -Raw | ConvertFrom-Json
          "version=$($spec.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.runtime.outputs.version }}

      - name: Install exact production runtime and test runner
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check 'pytest==9.0.2'
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --no-deps -r companion/source/runtime/windows/requirements-runtime.lock

      - name: Sync canonical Bridge test source
        shell: pwsh
        run: |
          $target = 'companion/source/addon'
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          New-Item -ItemType Directory -Path $target | Out-Null
          Copy-Item -LiteralPath 'addon/KeystoneLensBridge' -Destination $target -Recurse
          if (-not (Test-Path -LiteralPath 'companion/source/addon/KeystoneLensBridge/KeystoneLensBridge.toc' -PathType Leaf)) {
            throw 'Canonical Bridge test source sync failed.'
          }

      - name: Run full companion suite on native Windows
        shell: pwsh
        run: |
          Set-Location companion/source
          python -m pytest -q
          python -m compileall -q app/keystonelens_companion portable/portable_launcher.py portable/make_portable_zip.py

      - name: Parse portable PowerShell builder
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'companion/source/portable/build-portable.ps1'), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell parser rejected build-portable.ps1'
          }
