name: Validate KeystoneLens audit fixes final

on:
  push:
    branches:
      - agent/audit-fixes-20260816
    paths:
      - '.github/workflows/agent-audit-fixes.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/audit-fixes-20260816
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Compile addon Lua
        shell: bash
        run: |
          set -euo pipefail
          find addon/KeystoneLensBridge -type f -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            LUA_FILE="$file" lua5.1 -e 'local f,e=loadfile(os.getenv("LUA_FILE")); assert(f,e)'
          done
      - name: Run companion regression suite
        shell: bash
        run: |
          set -euo pipefail
          rm -rf companion/source/addon
          mkdir -p companion/source/addon
          cp -R addon/KeystoneLensBridge companion/source/addon/KeystoneLensBridge
          python -m pip install --disable-pip-version-check -q 'pytest==9.0.2' -r companion/source/app/requirements.txt
          cd companion/source
          set +e
          python -m pytest -q > /tmp/keystonelens-pytest.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/keystonelens-pytest.log').read_text(encoding='utf-8', errors='replace')[-12000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=KeystoneLens pytest failure::{text}')
          PY
            exit "$status"
          fi
          cat /tmp/keystonelens-pytest.log
          python -m compileall -q app
