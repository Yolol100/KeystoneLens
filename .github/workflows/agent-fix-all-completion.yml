name: Final KeystoneLens completion fixes

on:
  push:
    branches:
      - agent/fix-all-completion

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/fix-all-completion
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - name: Complete user-facing copy cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('companion/source/app/keystonelens_companion/ui.py')
          text = ui.read_text(encoding='utf-8')
          replacements = {
              'summary, text="Reset", command=self._reset_filters': 'summary, text="Reset filters", command=self._reset_filters',
              'text="Group Finder temporarily limited"': 'text="Group Finder data temporarily unavailable"',
              'text="KeystoneLens is waiting for a reliable Blizzard snapshot.\\nThe last valid list is kept intact."': 'text="KeystoneLens is waiting for complete Group Finder data.\\nThe last valid applicant list stays visible."',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          ui.write_text(text, encoding='utf-8')

          wcl = Path('companion/source/app/keystonelens_companion/wcl.py')
          text = wcl.read_text(encoding='utf-8').replace('WCL OAuth token ontbreekt', 'WCL OAuth token missing')
          wcl.write_text(text, encoding='utf-8')

          current_ui = ui.read_text(encoding='utf-8')
          forbidden = [
              'reliable Blizzard snapshot',
              'text="Reset", command=self._reset_filters',
          ]
          leftovers = [value for value in forbidden if value in current_ui]
          if leftovers:
              raise SystemExit('stale user-facing copy remains: ' + ', '.join(leftovers))
          if 'WCL OAuth token ontbreekt' in wcl.read_text(encoding='utf-8'):
              raise SystemExit('mixed-language WCL error remains')
          PY
      - name: Sync addon source for companion tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf companion/source/addon
          mkdir -p companion/source/addon
          cp -a addon/KeystoneLensBridge companion/source/addon/KeystoneLensBridge
      - name: Install dependencies and run full companion suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==9.0.2' -r companion/source/app/requirements.txt
          cd companion/source
          python -m pytest -q
          python -m compileall -q app/keystonelens_companion
          cd ../..
          git diff --check
      - name: Commit verified product fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-fix-all-completion.yml
          git config user.name 'Yolol100'
          git config user.email 'Andrew_Baeten@hotmail.com'
          git add companion/source/app/keystonelens_companion/ui.py companion/source/app/keystonelens_companion/wcl.py
          git diff --cached --check
          git commit -m 'Finish frontend and error copy cleanup'
          git push origin HEAD:refs/heads/agent/fix-all-completion
