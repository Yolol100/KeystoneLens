name: Verify KeystoneLens

on:
  push:
    branches: [main]
    paths:
      - "addon/**"
      - "companion/source/**"
      - ".github/workflows/verify-keystonelens.yml"
  pull_request:
    paths:
      - "addon/**"
      - "companion/source/**"
      - ".github/workflows/verify-keystonelens.yml"
  workflow_dispatch:

concurrency:
  group: keystonelens-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  source:
    name: Source contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          companion/source/app/keystonelens_companion
          companion/source/portable
          companion/source/scripts

      - name: Compile WoW Lua sources
        run: |
          find addon/KeystoneLensBridge companion/source/data-addon/KeystoneLensCompanionData -type f -name '*.lua' -print0 |
            while IFS= read -r -d '' file; do
              LUA_FILE="$file" lua5.1 -e 'local f,e=loadfile(os.getenv("LUA_FILE")); assert(f,e)'
            done

      - name: Verify Raider.IO tooltip integration
        run: lua5.1 companion/source/scripts/test_tooltip_contract.lua

      - name: Verify preload database contract
        run: python companion/source/scripts/test_preload_contract.py

      - name: Verify preload refresh contract
        run: python companion/source/scripts/test_preload_refresh_contract.py

      - name: Verify preload performance
        run: python companion/source/scripts/test_preload_performance.py

      - name: Verify minimal architecture
        run: python companion/source/scripts/verify_minimal_architecture.py

      - name: Verify Companion shutdown contract
        run: python companion/source/scripts/test_shutdown_contract.py

      - name: Verify Companion window restore contract
        run: python companion/source/scripts/test_window_visibility_contract.py

      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD

      - name: Publish source contract status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="failure"
          if [ "$JOB_STATUS" = "success" ]; then state="success"; fi
          curl -fsS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA"             -d "{\"state\":\"$state\",\"context\":\"keystonelens/source\",\"description\":\"Source, preload and tooltip contracts\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

  portable-windows:
    name: Build Windows portable
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: source
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Initialize Windows CI stage
        shell: powershell
        run: '"CI_STAGE=checkout-complete" >> $env:GITHUB_ENV'

      - name: Build and verify portable ZIP
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP "keystonelens-release"
          ./companion/source/portable/build-portable.ps1 -OutputDir $out
          Get-ChildItem -LiteralPath $out -Filter "KeystoneLens-Portable-*-Windows-x64.zip" |
            ForEach-Object { "PORTABLE_ARTIFACT=$($_.FullName)" >> $env:GITHUB_ENV }
          "CI_STAGE=portable-built" >> $env:GITHUB_ENV

      - name: Build complete download package
        shell: powershell
        run: |
          $version = (Get-Content -LiteralPath "companion/source/VERSION" -Raw).Trim()
          $root = Join-Path $env:RUNNER_TEMP "KeystoneLens-Complete-$version"
          $companion = Join-Path $root "Windows-Companion"
          $addons = Join-Path $root "WoW-AddOns"
          $completeZip = Join-Path $env:RUNNER_TEMP "KeystoneLens-Complete-$version-Windows-x64.zip"

          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          if (Test-Path -LiteralPath $completeZip) { Remove-Item -LiteralPath $completeZip -Force }

          New-Item -ItemType Directory -Path $companion -Force | Out-Null
          New-Item -ItemType Directory -Path $addons -Force | Out-Null

          Expand-Archive -LiteralPath $env:PORTABLE_ARTIFACT -DestinationPath $companion -Force
          Copy-Item -LiteralPath "addon/KeystoneLensBridge" -Destination $addons -Recurse
          Copy-Item -LiteralPath "companion/source/data-addon/KeystoneLensCompanionData" -Destination $addons -Recurse

          $instructions = @(
            "KeystoneLens $version - Complete pakket",
            "",
            "1. Kopieer de mappen uit WoW-AddOns naar:",
            "   World of Warcraft\_retail_\Interface\AddOns\",
            "",
            "2. Start daarna:",
            "   Windows-Companion\START-COMPANION.cmd",
            "",
            "3. Vul je Warcraft Logs Client ID en Client Secret in.",
            "4. Kies je WoW-regio (EU/US/KR/TW/CN).",
            "5. Kies je World of Warcraft _retail_\Screenshots map.",
            "6. Start de Companion bij voorkeur voor World of Warcraft.",
            "7. Open Mythic+ Group Finder. Voor reeds vooraf geladen spelers verschijnt WCL direct.",
            "8. Cache-misses worden opgeslagen voor een volgende WoW-start; er is geen per-applicant /reload-flow.",
            "",
            "Tooltip:",
            "- DPS/tank: Warcraft Logs M+ - DPS percentile",
            "- healer: Warcraft Logs M+ - Healing percentile"
          )
          $instructions | Set-Content -LiteralPath (Join-Path $root "INSTALLEREN.txt") -Encoding UTF8

          foreach ($required in @(
            "Windows-Companion\START-COMPANION.cmd",
            "Windows-Companion\runtime\python.exe",
            "WoW-AddOns\KeystoneLensBridge\KeystoneLensBridge.toc",
            "WoW-AddOns\KeystoneLensBridge\Core\Tooltip.lua",
            "WoW-AddOns\KeystoneLensCompanionData\KeystoneLensCompanionData.toc",
            "WoW-AddOns\KeystoneLensCompanionData\Data.lua",
            "INSTALLEREN.txt"
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $required))) {
              throw "Complete package missing: $required"
            }
          }

          Compress-Archive -Path (Join-Path $root "*") -DestinationPath $completeZip -CompressionLevel Optimal

          $verifyRoot = Join-Path $env:RUNNER_TEMP "KeystoneLens-Complete-Verify-$version"
          if (Test-Path -LiteralPath $verifyRoot) { Remove-Item -LiteralPath $verifyRoot -Recurse -Force }
          Expand-Archive -LiteralPath $completeZip -DestinationPath $verifyRoot -Force
          foreach ($required in @(
            "Windows-Companion\START-COMPANION.cmd",
            "Windows-Companion\runtime\python.exe",
            "WoW-AddOns\KeystoneLensBridge\KeystoneLensBridge.toc",
            "WoW-AddOns\KeystoneLensBridge\Core\Tooltip.lua",
            "WoW-AddOns\KeystoneLensCompanionData\KeystoneLensCompanionData.toc",
            "WoW-AddOns\KeystoneLensCompanionData\Data.lua",
            "INSTALLEREN.txt"
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $verifyRoot $required))) {
              throw "Verified ZIP missing after extraction: $required"
            }
          }

          "COMPLETE_ARTIFACT=$completeZip" >> $env:GITHUB_ENV
          "CI_STAGE=complete-zip-verified" >> $env:GITHUB_ENV

      - name: Upload verified portable ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: KeystoneLens-Windows-x64
          path: ${{ env.PORTABLE_ARTIFACT }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload complete KeystoneLens ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: KeystoneLens-Complete-Windows-x64
          path: ${{ env.COMPLETE_ARTIFACT }}
          if-no-files-found: error
          retention-days: 7

      - name: Mark artifacts uploaded
        shell: powershell
        run: '"CI_STAGE=artifacts-uploaded" >> $env:GITHUB_ENV'

      - name: Publish Windows package status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          CI_STAGE: ${{ env.CI_STAGE }}
        run: |
          state="failure"
          description="Windows CI failed after ${CI_STAGE:-unknown-stage}"
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Portable and complete ZIP verified"
          fi
          curl -fsS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA"             -d "{\"state\":\"$state\",\"context\":\"keystonelens/portable-windows\",\"description\":\"$description\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
