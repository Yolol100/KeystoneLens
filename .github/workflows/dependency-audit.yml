name: Dependency audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dependency-audit.yml'
      - 'companion/source/app/requirements.txt'
  pull_request:
    paths:
      - '.github/workflows/dependency-audit.yml'
      - 'companion/source/app/requirements.txt'
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  python-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'

      - name: Install pinned audit tool
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pip-audit==2.10.1'

      - name: Audit production Python requirements
        shell: bash
        run: |
          set -euo pipefail
          pip-audit --strict --progress-spinner off -r companion/source/app/requirements.txt
