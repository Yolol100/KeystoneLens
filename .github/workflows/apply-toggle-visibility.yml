name: Apply Settings toggle visibility

on:
  push:
    branches:
      - settings-toggle-visibility-20260901
    paths:
      - .github/apply-toggle-visibility.py
      - .github/workflows/apply-toggle-visibility.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply toggle visibility fix
        shell: bash
        run: |
          set -euo pipefail
          python .github/apply-toggle-visibility.py
          git diff --check
          python -m py_compile companion/source/app/keystonelens_companion/ui.py
          git diff -- companion/source/app/keystonelens_companion/ui.py

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companion/source/app/keystonelens_companion/ui.py
          git commit -m "Make Settings toggles clearly visible"
          git push origin HEAD:settings-toggle-visibility-20260901
