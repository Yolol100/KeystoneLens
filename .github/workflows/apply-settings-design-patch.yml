name: Apply Settings design patch

on:
  push:
    branches:
      - settings-design-polish-20260831
    paths:
      - .github/settings-design.patch
      - .github/workflows/apply-settings-design-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply verified UI patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/settings-design.patch
          git apply .github/settings-design.patch
          git diff --check
          git diff --exit-code -- .github/settings-design.patch .github/workflows/apply-settings-design-patch.yml
          git diff -- companion/source/app/keystonelens_companion/ui.py

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companion/source/app/keystonelens_companion/ui.py
          git commit -m "Polish Settings dialog layout"
          git push origin HEAD:settings-design-polish-20260831
