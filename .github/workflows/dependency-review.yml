name: Dependency review

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/dependency-review.yml'
      - 'companion/source/app/requirements.txt'
      - 'companion/source/installer/windows/requirements-runtime.txt'
      - 'companion/source/installer/windows/requirements-runtime.lock'

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
